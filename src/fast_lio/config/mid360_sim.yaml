/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            # 仿真 IMU 的陀螺噪声 stddev 设为 1e-5 rad/s（mid360.xacro），几乎无噪声。
            # 原默认 gyr_cov=0.1 会让 iEKF 认为角速度每步变化很大、过少信任陀螺积分，
            # 纯旋转时 FAST-LIO 的 yaw 会明显低估（实测 8s 原地旋转 3.2rad 只估到 ~2.8rad）。
            # 降到 0.01 让滤波器更信任陀螺，减少纯旋转时的 yaw 漂移。
            gyr_cov: 0.01
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            # 雷达 link 物理前倾 30°（绕 base_link +y），IMU 坐标系反向旋回水平。
            # 因此 lidar->IMU 的旋转为 Ry(+30°)，平移为 -Ry(30°)·t_imu
            # （t_imu=(0.011,0.02329,-0.04412) 为 IMU 在雷达系下的安装位置）。
            extrinsic_T: [ 0.0125337, -0.02329, 0.0437090 ]
            extrinsic_R: [ 0.8660254, 0., 0.5,
                            0., 1., 0.,
                           -0.5, 0., 0.8660254 ]
            # IMU(机体)在物理 base_link 系中的安装位置，由 URDF 链
            #   base_link --(0.346,0,0.93, Ry30°)--> livox --(0.011,0.02329,-0.04412, Ry-30°)--> livox_imu
            # 合成：R = I，t = (0.346,0,0.93) + Ry(30°)·(0.011,0.02329,-0.04412)
            #          = (0.3334663, 0.02329, 0.886291)
            # FAST-LIO 内部状态是 IMU 位姿；发布 odom→base_link 时右乘该外参的逆，
            # 让 Nav2 足迹和 RViz 车模落在真实车体上（否则整体前移 0.33 m，
            # 车尾超出足迹，出现“RViz 没撞、Gazebo 撞了”）。R 缺省单位阵。
            body_to_base_T: [0.3334663, 0.02329, 0.886291]
            body_to_base_R: [1., 0., 0.,
                             0., 1., 0.,
                             0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            # 【改动】false→true：/cloud_registered 原先发的是 feats_down_body
            # （0.5 m 体素降采样后每帧只剩一两百点），3D 重定位的 ICP 输入太稀。
            # 改成 true 后发 feats_undistort（每帧 ~590 点），配准更稳。
            dense_publish_en: true       # true: publish the full (undistorted) scan in global frame.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.