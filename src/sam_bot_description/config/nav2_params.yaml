# ============================================================================
#  【改动】AMCL 已移除。
#  全局定位改由 fastlio_localization/relocalization_node 完成：它把
#  FAST-LIO 的 /cloud_registered（odom 系点云）与先验 3D 地图
#  （map/prior_3d_map.pcd）做全局搜索 + ICP，直接发布 map->odom。
#  参数见 fastlio_localization/config/relocalization_params.yaml。
#
#  说明：nav2_params.yaml 里不再保留 amcl 段；map_server 段仍然保留，
#  navigation.launch.py 会单独启动 map_server 并覆盖 yaml_filename。
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /demo/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 自定义 BT：去掉倒车恢复动作，并给 FollowPath 显式指定 goal_checker_id。
    default_nav_to_pose_bt_xml: "$(find-pkg-share sam_bot_description)/behavior_trees/navigate_to_pose_w_replanning_and_recovery_no_backup.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share sam_bot_description)/behavior_trees/navigate_through_poses_w_replanning_and_recovery_no_backup.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 【修复偶发 FollowPath 中止】0.3 -> 2.0 s。WSL2 上 Gazebo + FAST-LIO
    # + 两张代价地图同时跑时，控制环会偶发掉到 1~2 Hz，EGO 一次重规划
    # 超过 planning_time_budget 就抛异常；0.3 s 的容差等于"一次慢周期
    # 立刻 patience 超时"（run19 第 17 条 swath 转场处只有一次失败就被
    # 中止）。2.0 s 让控制器有几次重试机会，代价是真正卡死时晚 2 s 发现。
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    # 【新增】coverage_goal_checker：覆盖任务逐条 swath 跟踪时要求更高的终点精度，
    # 否则 0.25 m 的默认容差会让相邻条带出现漏扫/重叠。转场和绕行仍用宽松的
    # general_goal_checker。
    goal_checker_plugins: ["general_goal_checker", "coverage_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: /demo/odom
    use_realtime_priority: false
    enable_stamped_cmd_vel: true

    # Progress checker parameters
    # 【修正】原来 0.5 m / 10 s 太严：转场终点只差 0.5 m 时，MPPI（当时的局部规划器）先原地
    # 转向（旋转不计入位移），10 s 内凑不满 0.5 m 就被判 "Failed to make
    # progress"，BT 随即进恢复流程 Spin 1.57 rad，反而把朝向越转越偏，
    # 形成 abort→Spin→再 abort 的死循环（实测卡住 120 s 后转场超时）。
    # 放宽到 0.15 m / 20 s：正常慢速收敛不会误判，真卡死也能在 20 s 内发现。
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    # 【修正】转场目标不需要精确到 0.25 m。实测 MPPI 在"距目标 0.5 m、
    # 且需要横移/大角度修正"的终点会来回画龙，20 s 内位移不足 0.15 m，
    # 一直被进度检查打断，转场 120 s 超时。转场只要把车带到 swath 起点
    # 附近即可，紧接着的 FollowPath 会自动把车拉到条带直线上，因此把
    # 转场用的 general_goal_checker 放宽到 0.6 m / 0.6 rad（与执行器的
    # transit_tolerance 一致）。
    # 【关键修复】yaw_goal_tolerance 0.6 -> 3.2：转场目标只认"到点"，
    # 不认"到朝向"。
    #   EGO 的终点对齐逻辑（controller.cpp:672）在 goal_distance<=xy_tol*0.5
    #   且 |yaw_err|>yaw_tol 时进入"原地旋转"，只下发 w、不发 v。条带起点通常
    #   贴着墙/立柱（执行器日志："起点 0.9 m 内有障碍，车体在起点转不开"），
    #   1.09 m 长的车体原地转 70° 会撞墙，yaw 卡在 -1.5 rad 附近来回弹，
    #   30 s 后进度检查判 "Failed to make progress"，整条 swath 被跳过。
    #   3.2 rad > π，等价于"转场只校验位置"：到点即成功，随后的条带
    #   FollowPath 用 pursue() 的曲率跟踪"边走边转"进入条带方向。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 【修复"离终点还有一小段就停"】0.6 -> 0.35。转场到条带起点时，
      # 0.6 m 的到位容差会让车在离条带起点 0.6 m 处就判"到达"停住，
      # 用户看到的就是"距离终点还有一小段车挺住了"。0.35 m 仍保留
      # 靠墙/靠柱时到不了精确点的余量（条带 FollowPath 会继续把车带到
      # 起点线），同时明显缩小可见的停顿间距。
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 3.2
    # 【新增】覆盖任务专用：条带终点需要走准，但不必反复原地调整朝向，
    # 保持 stateful=False，避免上一条条带的到达判定影响下一条。
    #
    # 【修正】xy_goal_tolerance 0.05 -> 0.12：条带终点离东侧墙只有 0.55 m
    # （多边形内缩）再减 swath_end_trim 0.25 m，MPPI 在膨胀层附近很难精确
    # 压进 5 cm，实测每条 swath 都在终点停在 0.07~0.10 m 处不动，5 s 后被
    # 执行器的“进度停滞”兜底当成绕行处理——多花 5 s 且发出一次假的
    # blocked_interval。0.12 m 仍远小于 0.8 m 的条带间距，不会造成漏扫。
    coverage_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.10
    # 【改动】局部规划器 MPPI -> DWB（nav2 里的 DWA 实现，插件名
    # dwb_core::DWBLocalPlanner）。
    # 【再改动】局部规划器 DWB -> EGO（ego_nav2_controller::EgoController），
    # 见下面 FollowPath 段。以下 MPPI->DWB 的换法说明留作历史。
    #
    # 为什么换：
    #   * MPPI 每周期采样 2000 条轨迹再做 softmax 加权平均，本机是 WSL2 上同时
    #     跑 Gazebo + FAST-LIO + 重定位 + 两张代价地图，日志里反复出现
    #     "Control loop missed its desired rate of 20 Hz"，控制周期抖动直接表现
    #     为 FollowPath 中途 status=6 中止；DWA 是对固定采样网格做前向仿真 + 代价
    #     打分，确定性更强、更容易解释。
    #   * MPPI 的采样噪声要靠开大方差才采得到"能跟住半径 0.4 m 半圆"的轨迹
    #     （vx_std 0.2、wz_std 0.4 时掉头要约 16 s，放到 0.4/0.8 才降到 4 s）。
    #     DWA 的速度采样是均匀网格，不存在这个问题。
    #
    # 保持不变的关键约束：
    #   * 速度/加速度上限与 velocity_smoother 完全对齐（0.5 m/s、1.9 rad/s、
    #     2.5 m/s²、3.2 rad/s²），否则平滑器会截断指令，DWA 预演与实际不符。
    #   * max_vel_theta 1.9：半径 0.4 m 的半圆换轨需要 vx≈0.5、wz≈1.25，采样网格
    #     （0.5/19≈0.026 m/s、3.8/19≈0.20 rad/s）能覆盖这条曲线。
    #   * min_vel_x 0.0：**不允许倒车**。实测打开倒车（-0.2 m/s）后，DWB 在
    #     "前进轨迹分低"的位置（条带旁有柱子/箱子、换轨弧线起点）会选
    #     "倒车 + 转向"的采样，Oscillation 评价器随后锁住方向翻转，车就在原地/
    #     小半径连续打转：实测第 1 段起步转了 180 s、第 9 段柱子旁又转了 180 s，
    #     两次都靠 FollowPath 超时才脱身。
    #     倒车原本是为"车头压进孔洞后无法起步"准备的兜底，但根因已由
    #     hole_end_clearance=0.60 解决（实测第 16 段在柱子前正常到达终点并
    #     顺利转场到第 17 段）；万一还有残留碰撞，执行器的"连续两次瞬时
    #     abort -> NavigateToPose 脱困（BT 会清代价地图）"负责兜底。
    #   * transform_tolerance 1.0：与两张代价地图一致，兜住 FAST-LIO 的
    #     odom->base_link 晚到 0.3~0.6 s。
    FollowPath:
      plugin: "ego_nav2_controller::EgoController"
      # 【改动】局部规划器 DWB -> EGO（ego_nav2_controller::EgoController）。
      # EGO 用 B 样条局部优化 + 差速跟踪 + 真实 footprint 碰撞检查；遇障碍时
      # 走"提前离轨 -> 逐渐回轨"的平滑弧（smooth_detour_enabled），回轨时机由
      # route_return_* 控制——目标是替代 DWB 遇障碍"乱走打转、不绕行"的表现。
      #
      # 速度/角速度上限（0.5 m/s、0.43 rad/s）低于原 DWB 的 1.9 rad/s：半径
      # 0.4 m 的半圆换轨会被 EGO 按前方曲率自动降速（约 0.4*0.43≈0.17 m/s），
      # 换轨更慢但更平顺。EGO 只前进、不倒车，与当前 min_vel_x=0 的意图一致。
      #
      # drive_axle_offset_*：车体中心到驱动轴的偏移。工控机实车 base_link 在
      # 驱动轴前方 0.25 m；本仿真里 base_link 就是驱动轴中心，偏移为 0。
      max_linear_vel: 0.5
      max_angular_vel: 0.43
      max_linear_accel: 0.2
      max_angular_accel: 0.4
      lookahead_dist: 0.7
      planning_horizon: 4.5
      replan_period: 0.5
      # 【修复偶发 FollowPath 中止】0.5 -> 1.5 s：CPU 争用时一次 4.5 m
      # 视野的 B 样条重规划 + 扫掠走廊校验可能超过 0.5 s，超过就丢弃结果
      # 抛异常；放宽后慢周期仍能交出（略旧的）有效轨迹，而下面
      # max_pose_age 仍会把真正过时的位姿挡掉。
      planning_time_budget: 1.5
      max_pose_age: 0.5
      # 【修复"原地打转"】0.50/0.25 -> 1.00/0.45。
      # pursue()（controller.cpp:680）的规则是：航向误差 > rotate_enter_angle
      # 就停下车原地转（只发 w、不发 v），小于 rotate_exit_angle 才恢复
      # 曲率跟踪"边走边转"。0.50 rad（29°）太低，转场/换轨时 30°~90° 的
      # 正常转向全被判成"原地转"，在条带起点/立柱旁撞墙后 yaw 来回弹。
      # 1.00/0.45 让 57° 以内的转向都用车速+角速度的弧线完成，
      # 只有接近掉头的大角度才原地转（曲率跟踪在 180° 附近会奇异，必须保留）。
      rotate_enter_angle: 1.00
      rotate_exit_angle: 0.45
      # 【关键修复】EGO 把 map->odom 的累积变化当作"地图修正"：超过这两个阈值
      # 就清空轨迹、强制重新规划。本项目用 FAST-LIO 3D 重定位（relocalization_node
      # 10 Hz 发布 map->odom，correction_alpha=0.6），实测 map->odom 平移抖动
      # ±3 cm、偏航抖动 ±0.2°（见 tf2_echo）。默认 0.03 m/1° 会被这个正常抖动
      # 每个控制周期都触发，EGO 反复 "map correction changed: replan before
      # motion"、从不真正下发运动指令，车停在原地被 progress_checker 判
      # "Failed to make progress"。放宽到 0.15 m / 5°：只吸收定位噪声，真正的
      # 重定位跳变（relocalization 的 max_tracking_jump=1.0 m / 0.6 rad 量级）
      # 仍会被捕获并触发重规划。
      # 【再放宽到 0.25 m】controller.cpp 的判据已改为"平移量只取 x/y +
      # 旋转量分开检验"，但 FAST-LIO 重定位在机器人移动时 map->odom 的
      # x/y 仍会缓慢漂移（实测 8 s 内约 0.10~0.12 m）。0.15 m 会让这种正常
      # 漂移周期性触发清轨迹（run13 实测每 2~8 s 一次），车一顿一顿。
      # 0.25 m 只吸收慢漂移；真跳变（>0.5 m）仍会触发。
      replan_frame_translation: 0.25
      replan_frame_rotation: 0.08726646259971647
      # 【调小】0.60 -> 0.45。EGO 的"障碍物间隙圆 + A* 搜索膨胀"都取这个值
      # （inflation = clearance + resolution = 0.50 m）。本项目 coverage 规划器
      # 有意忽略 5 个立柱孔洞（"规划忽略孔洞，障碍物执行期绕行"），条带会贴着
      # 立柱边缘 ~0.1 m 通过；0.60 m 间隙会让 EGO 在离柱 0.57 m 处就报
      # "start/target inside inflated obstacle"、无法规划绕行，整条 swath 被跳过。
      # 0.45 m 仍比车体半宽 0.38 m 多 0.07 m 余量（真实碰撞由完整 footprint 检查
      # 把关），同时让 EGO 能在立柱附近规划绕行轨迹。
      obstacle_clearance: 0.45
      optimization_clearance_margin: 0.10
      route_return_weight: 0.4
      route_length_weight: 0.05
      smooth_detour_enabled: true
      # 横移坡度段的**下限**长度（实际取 max(本值, 1.5×横移量)，保证参考曲率
      # 在车能跟住的范围内）。原来 1.5 m 且峰值放在障碍中心，车是"贴着障碍
      # 在转弯"：临时障碍物一出现，参考就在整个 4.5 m 视域里缓缓弯开，看着
      # 像"大老远就避障"。现在横移在车头到达障碍前 0.7 m 就完成
      # （front_extent 0.55 + 0.15 余量）。
      detour_transition_length: 1.1
      # 回轨段长度：回轨必须等车尾越过障碍后才开始（rear_clearance =
      # 车尾 0.54 m + 0.25 m 余量），这段再花 1.2 m 平滑并回航线。
      detour_return_length: 1.2
      detour_max_offset: 1.8
      detour_reference_weight: 1.5
      return_min_forward_distance: 1.2
      curve_preview_dist: 3.0
      max_lateral_accel: 0.12
      maneuver_max_linear_vel: 0.25
      maneuver_curvature_threshold: 0.15
      obstacle_slow_distance: 1.2
      speed_reaction_time: 0.6
      speed_transition_margin: 0.15
      return_check_period: 0.5
      return_min_deviation: 0.20
      return_min_improvement: 0.05
      return_max_path_age: 3.0
      return_confirmations: 2
      drive_axle_offset_x: 0.0
      drive_axle_offset_y: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      # 【新增】FAST-LIO 的 odom->base_link 用雷达帧时间打时间戳，但要等该帧
      # 处理完才发出去，实测比仿真时钟落后 0.3~0.6 s。nav2 的 ObstacleLayer 把
      # 这个值当作 tf2 MessageFilter 的缓存时长：默认 0.3 s 时，时间戳≈当前
      # 时刻的 /scan 等不到迟到的 TF，就被判 "the timestamp on the message is
      # earlier than all the data in the transform cache" 整条丢掉 —— 局部图
      # 收不到任何激光点，障碍物自然检测不到。放宽到 1.0 s 让 /scan 能等到
      # 迟到的 TF（代价只是 TF 缺失时最多多等 1 s）。
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 【改动】4×4 -> 12×12：换 EGO 局部规划器后，EGO 的规划时域
      # planning_horizon=4.5 m，且它把局部代价地图边界之外的栅格一律当成障碍，
      # 4×4 m（车周围 ±2 m）会让 EGO 永远只能看到前方 1 m 出头、无法规划
      # 4.5 m 时域，车会停在半路。12×12 m（±6 m）覆盖 4.5 m 时域 + 0.7 m
      # 前视 + 余量，与工控机 EGO 入口的 12×12 m 局部图保持一致。
      # 代价只是单次更新/清除的栅格数从 80×80 增到 240×240；本机若 CPU
      # 吃紧可先把 update_frequency 从 5.0 降到 3.0。
      width: 12
      height: 12
      resolution: 0.05
      # 【改动】新 CAD 模型外形约 1.05 m(长) x 0.74 m(宽，含驱动轮)，base_link 在车体中心。
      # 旧值 0.42 x 0.39 是按小机器人设置的，若继续沿用会让规划器认为可以贴墙太近，
      # 实际车身会撞到障碍；这里按网格包络外扩 1~2 cm。
      footprint: "[ [0.55, 0.38], [0.55, -0.38], [-0.54, -0.38], [-0.54, 0.38] ]"
      # 【重要改动】局部代价地图改用普通 ObstacleLayer（2D），不再用 VoxelLayer。
      # 原因：
      #   1) /scan 本身就是一平面 2D 扫描，没有任何立体信息，VoxelLayer 的
      #      z 窗口只会带来“点落在窗口外被静默丢掉”的风险（历史上 origin_z
      #      与 z_voxels 配错导致局部图长期全 0）；
      #   2) VoxelLayer 内部用 nav2_voxel_grid，把 z 索引塞进 uint32 的低/高
      #      16 位，z_voxels 最大 16，设大一点 resize() 直接失败、栅格尺寸为 0，
      #      局部图同样全 0；
      #   3) 全局代价地图用的就是 ObstacleLayer，实测标记/清除都正常
      #      （放一个 0.6 m 箱子：局部非 0 栅格 0 -> 642，删掉后 642 -> 0）。
      #      ObstacleLayer 只用 min/max_obstacle_height 做高度过滤，没有隐式
      #      z 窗口，也不会因为 FAST-LIO 的 z 漂移而突然失效。
      # 如果以后要接真正的 3D 点云做立体避障，再换回 VoxelLayer，并把
      # z_voxels 控制在 16 以内、origin_z/z_resolution 覆盖实际点云高度。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 【关键修正】FAST-LIO 的 odom 系原点在 IMU 起始位姿上（离地约 1.15 m），
        # base_link 在 odom 系 z ≈ -0.91 ~ -1.16（会漂），/scan 的点也在这一高度。
        # 默认 min_obstacle_height=0.0 会把它们全部当成“地面以下的非法命中点”
        # 丢掉，表现为“雷达探测不到障碍物、完全无法避障”。必须给负值；
        # max_obstacle_height=2.0 保证 1.4 m 高的箱子、墙都在范围内。
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        # 【关键】为什么加第二个观测源 cloud：
        # /scan 是 360 束点云投影出来的，30° 前倾后绝大部分回波打到地面又被
        # 高度过滤掉，只剩 120 多束有效回波；障碍物拖走后，没有被任何射线
        # 穿过的栅格就永远清不掉 —— 表现就是“障碍物移开了，代价地图上的
        # 障碍包络一直留着”。FAST-LIO 的 /cloud_registered 每帧上千点、覆盖
        # 整个前方，用它做稠密射线清除，实测 4 s 内就能把包络清干净。
        # 顺序：scan 先标（可靠），cloud 再补标 + 密集清除。
        observation_sources: scan cloud
        scan:
          # 【修正】相对名 `scan` 会被解析成 /<costmap>/scan（0 个发布者），
          # 障碍层收不到任何激光，局部避障完全失效；必须写绝对话题 /scan。
          topic: /scan
          # 源代码里的 min_obstacle_height 会覆盖层级的同名参数，
          # 这里显式给负值，否则点（odom z≈-0.9~-1.2）全部被滤掉。
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # raytrace_max_range 必须 ≥ obstacle_max_range：超过 raytrace 距离的
          # 回波会被整条跳过（不是截断），那条射线就不参与清除，被标记的栅格
          # 只能等别的射线来清。局部地图只有 4×4 m，取 10 m 足以清空整个窗口。
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        cloud:
          # 【修正】用 body 系点云 /cloud_registered_body（FAST-LIO 的 IMU 体系）。
          # 为什么不用 /cloud_registered（frame=odom）：nav2 标记和射线清除时把
          # "点云所在坐标系的原点"当作传感器原点，odom 原点是 FAST-LIO 的起始
          # 位姿；车一开出去就落在 4×4 m 滚动窗口外，整条观测被 continue 掉
          # （日志刷 "Sensor origin at (0.00, 0.00) is out of map bounds ...
          # cannot raytrace"），局部图彻底失明。body 系的传感器原点就是机器人
          # 自己，永远在窗口中心。
          #
          # 【配套修正】FAST-LIO 之前把这条点云的 frame_id 写成 base_link，
          # 但它实际是 IMU 体系（laserMapping.cpp publish_frame_body 里用
          # RGBpointBodyLidarToIMU 转的）。URDF 里 IMU 比 base_link 高 0.89 m，
          # nav2 会用 odom<-base_link（z≈-0.96）而不是 odom<-livox_imu（z≈-0.07）
          # 去变换，整帧点云被压低 0.89 m，真实障碍全部落到下面的高度带之外被
          # 滤掉 —— 这就是"拖进来的障碍物检测不到、直接撞上去"的直接原因。
          # 已把 laserMapping.cpp 里的 frame_id 改回 livox_imu，此处才成立。
          #
          # 【重要】高度过滤用的是**代价地图全局坐标系**（这里是 odom），不是
          # 点云自己的坐标系：nav2 的 ObservationBuffer 先把点云变换到
          # global_frame 再按 z 过滤。odom 系里地面 z≈-1.15（雷达离地 1.15 m），
          # 障碍物都在 -0.9 以上。下限 -0.85 滤掉地面并给 FAST-LIO 的高度漂移
          # 留 0.3 m 余量，上限 2.0 覆盖 1.4 m 高的箱子和墙面。
          #
          # 【关键修正】cloud 源只做清除（marking: False）。原来的 marking: True
          # 前提是"地面永远在 -1.15"，但 3D 重定位给的 map->odom 有 z 漂移，
          # run17 实测地面已经漂到 -0.87，正好压在 -0.85 这条下限上：地面的
          # 回波被当成障碍标成致命栅格，在 (-6.4..-3.4, -7.5..-4.4) 一带铺出
          # 一片"幽灵障碍"，转场终点恰好落进去，EGO 一直报
          # "start/target inside inflated obstacle" → patience 超时 → 任务终止。
          # /scan 的高度过滤是在 base_link 系里做的（相对地面，不随 map z 漂移），
          # 标记本来就没有幽灵，所以标记交给 /scan，cloud 只保留稠密清除。
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.85
          max_obstacle_height: 2.0
          # 局部窗口只有 4×4 m，6 m 足够覆盖；再远只会白白扫栅格。
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      # 【新增】同 local_costmap：FAST-LIO 的 odom->base_link 比雷达时间戳晚
      # 0.3~0.6 s 才发出，默认 0.3 s 的 MessageFilter 缓存会把 /scan 全丢掉。
      # 全局图的 cloud 源（/cloud_registered，odom 系）不受影响，但 scan 源需要。
      transform_tolerance: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 【改动】与 local_costmap 保持同一矩形轮廓（机器人不是圆形，用 robot_radius 会
      # 在窄通道里过度保守或碰撞，取决于外接圆/内切圆取法）。
      footprint: "[ [0.55, 0.38], [0.55, -0.38], [-0.54, -0.38], [-0.54, 0.38] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 【关键修正】与 local_costmap 同一个问题：map 系原点也在 IMU 起始位姿，
        # /scan 的点在 map 系 z ≈ -0.91，默认 min_obstacle_height=0.0 会把它们
        # 全部当作“地面以下的非法命中点”丢掉，全局障碍层永远收不到障碍物。
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        # 与 local_costmap 同一套分工：scan 负责标记，cloud 负责稠密清除。
        observation_sources: scan cloud
        scan:
          # A relative topic will be appended to the parent of the global_costmap namespace.
          # For example:
          #   * User chosen namespace is `tb4`.
          #   * User chosen topic is `scan`.
          #   * Topic will be remapped to `/tb4/scan` without `global_costmap`.
          #   * Use global topic `/scan` if you do not wish the node namespace to apply
          # 【修正】相对名 `scan` 会被解析成 /<costmap>/scan（0 个发布者），障碍层
          # 收不到任何激光，局部避障完全失效；必须写绝对话题 /scan。
          topic: /scan
          # 【新增】同上：/scan 的点在 map 系 z ≈ -0.91，默认 0.0 会被全部滤掉。
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 【改动】2.5/3.0 -> 15.0/15.0：雷达前倾 30° 后，回波大多落在 4~15 m
          # （地面/墙），原来的 2.5 m 几乎什么都标不上，规划器看不到拖进来的
          # 障碍物。这里放到雷达量程上限 15 m，标记范围与清除范围一致：
          # 凡是能被标上的回波，都能被同一条射线清掉，不会留下幽灵障碍。
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
        cloud:
          # 【修正】改用 /cloud_registered_body（livox_imu 系）而不是
          # /cloud_registered（odom 系）。两者点数完全相同，但 nav2 把"点云
          # 坐标系的原点"当传感器原点做射线清除：odom 原点是 FAST-LIO 的起始
          # 位姿，离车越远，清除射线就越是从一个错误的位置发散出去，会把沿途
          # 的真实障碍（墙）一起清掉。livox_imu 的原点就是车上的雷达，射线
          # 方向才是对的。map 系 z 原点与 odom 系几乎重合（map<-odom 平移
          # ≈(0,0,0.02)），所以下面的高度带不用改。
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          # 【关键修正】只清除、不标记。原因见 local_costmap 的 cloud 源：
          # 这个源的高度过滤是 map 系的绝对值（-0.85），而 3D 重定位的
          # map->odom z 会漂移；地面一旦漂到 -0.85 以上，整片地面就被标成
          # 致命障碍。标记统一交给 /scan（base_link 系相对高度过滤，不怕漂移）。
          marking: False
          clearing: True
          # 地面点（map 系 z ≈ -1.14）必须滤掉，否则整片地面被标成障碍。
          min_obstacle_height: -0.85
          max_obstacle_height: 2.0
          # 【关键】全局地图是 21×21 m，点云每帧都整幅扫描会让单次更新超过
          # update_frequency 周期，缓冲区越积越多（实测滞后 25 s 还在涨）。
          # 只清机器人周围 6 m —— 幽灵障碍只在机器人附近影响规划，
          # 远处的残留由 /scan 自己的射线清。
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

# The yaml_filename value is overridden at launch time by bringup_launch.py's "map"
# argument (via RewrittenYaml param_rewrites). It must still be present here — even empty —
# otherwise the rewrite has no key to replace and map_server fails to configure.
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/demo/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/demo/cmd_vel"
    enable_stamped_cmd_vel: true
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"      # 同理：绝对话题，避免解析成 /collision_monitor/scan
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    enable_stamped_cmd_vel: true