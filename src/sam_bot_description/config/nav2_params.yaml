# ============================================================================
#  【改动】AMCL 已移除。
#  全局定位改由 fastlio_localization/relocalization_node 完成：它把
#  FAST-LIO 的 /cloud_registered（odom 系点云）与先验 3D 地图
#  （map/prior_3d_map.pcd）做全局搜索 + ICP，直接发布 map->odom。
#  参数见 fastlio_localization/config/relocalization_params.yaml。
#
#  说明：nav2_params.yaml 里不再保留 amcl 段；map_server 段仍然保留，
#  navigation.launch.py 会单独启动 map_server 并覆盖 yaml_filename。
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /demo/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 自定义 BT：去掉倒车恢复动作，并给 FollowPath 显式指定 goal_checker_id。
    default_nav_to_pose_bt_xml: "$(find-pkg-share sam_bot_description)/behavior_trees/navigate_to_pose_w_replanning_and_recovery_no_backup.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share sam_bot_description)/behavior_trees/navigate_through_poses_w_replanning_and_recovery_no_backup.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    # 【新增】coverage_goal_checker：覆盖任务逐条 swath 跟踪时要求更高的终点精度，
    # 否则 0.25 m 的默认容差会让相邻条带出现漏扫/重叠。转场和绕行仍用宽松的
    # general_goal_checker。
    goal_checker_plugins: ["general_goal_checker", "coverage_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: /demo/odom
    use_realtime_priority: false
    enable_stamped_cmd_vel: true

    # Progress checker parameters
    # 【修正】原来 0.5 m / 10 s 太严：转场终点只差 0.5 m 时，MPPI 先原地
    # 转向（旋转不计入位移），10 s 内凑不满 0.5 m 就被判 "Failed to make
    # progress"，BT 随即进恢复流程 Spin 1.57 rad，反而把朝向越转越偏，
    # 形成 abort→Spin→再 abort 的死循环（实测卡住 120 s 后转场超时）。
    # 放宽到 0.15 m / 20 s：正常慢速收敛不会误判，真卡死也能在 20 s 内发现。
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    # 【修正】转场目标不需要精确到 0.25 m。实测 MPPI 在"距目标 0.5 m、
    # 且需要横移/大角度修正"的终点会来回画龙，20 s 内位移不足 0.15 m，
    # 一直被进度检查打断，转场 120 s 超时。转场只要把车带到 swath 起点
    # 附近即可，紧接着的 FollowPath 会自动把车拉到条带直线上，因此把
    # 转场用的 general_goal_checker 放宽到 0.6 m / 0.6 rad（与执行器的
    # transit_tolerance 一致）。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.6
    # 【新增】覆盖任务专用：条带终点需要走准，但不必反复原地调整朝向，
    # 保持 stateful=False，避免上一条条带的到达判定影响下一条。
    #
    # 【修正】xy_goal_tolerance 0.05 -> 0.12：条带终点离东侧墙只有 0.55 m
    # （多边形内缩）再减 swath_end_trim 0.25 m，MPPI 在膨胀层附近很难精确
    # 压进 5 cm，实测每条 swath 都在终点停在 0.07~0.10 m 处不动，5 s 后被
    # 执行器的“进度停滞”兜底当成绕行处理——多花 5 s 且发出一次假的
    # blocked_interval。0.12 m 仍远小于 0.8 m 的条带间距，不会造成漏扫。
    coverage_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.10
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      # 【关键调参】U 形掉头太慢的根因在 MPPI 的采样噪声，而不是底盘或代价地图。
      # MPPI 每次迭代围绕“当前最优控制序列”叠加白噪声采样 2000 条轨迹，最后按
      # softmax 加权平均得到指令。半径 0.4 m 的半圆要求持续 vx≈0.5、wz≈1.25，
      # 而原参数 vx_std=0.2、wz_std=0.4 意味着这两个值分别是 2.5σ / 3.1σ——
      # 单条轨迹要在 56 个时间步上每步都抽到这么大的同向噪声，概率几乎为 0，
      # 采样集中根本没有“能跟住半圆”的轨迹；同时 PathAlignCritic 对横向偏差
      # 惩罚很重（权重 14），停在弧线起点横向偏差为 0，于是 softmax 平均退化成
      # “原地极慢转”（实测 nav_v≈0、nav_w≈0.10 rad/s，10~16 s 才蹭过 1.26 m）。
      # 放大采样标准差后，半圆轨迹进入采样集，掉头从 16 s 降到约 4 s
      # （弧段均速 0.078 -> 0.31 m/s）。实测直线段横向偏差 rms 仅 1 cm，不影响
      # 条带跟踪精度；PathAlign/PathFollow 权重调整无效，故保持原值。
      vx_std: 0.4
      vy_std: 0.2
      wz_std: 0.8
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      # 【新增】FAST-LIO 的 odom->base_link 用雷达帧时间打时间戳，但要等该帧
      # 处理完才发出去，实测比仿真时钟落后 0.3~0.6 s。nav2 的 ObstacleLayer 把
      # 这个值当作 tf2 MessageFilter 的缓存时长：默认 0.3 s 时，时间戳≈当前
      # 时刻的 /scan 等不到迟到的 TF，就被判 "the timestamp on the message is
      # earlier than all the data in the transform cache" 整条丢掉 —— 局部图
      # 收不到任何激光点，障碍物自然检测不到。放宽到 1.0 s 让 /scan 能等到
      # 迟到的 TF（代价只是 TF 缺失时最多多等 1 s）。
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 【改动】3×3 -> 4×4：原来局部代价地图只有车周围 1.5 m，拖进来的障碍物
      # 进入 1.5 m 才开始避障，配合 MPPI 的预测时域往往来不及。4×4 给到 2 m。
      # 注意：局部代价地图再大也没用，超出这张图范围的障碍物仍然不会显示，
      # 远处障碍物由 global_costmap 的 obstacle_layer 负责（见下面 15 m）。
      width: 4
      height: 4
      resolution: 0.05
      # 【改动】新 CAD 模型外形约 1.05 m(长) x 0.74 m(宽，含驱动轮)，base_link 在车体中心。
      # 旧值 0.42 x 0.39 是按小机器人设置的，若继续沿用会让规划器认为可以贴墙太近，
      # 实际车身会撞到障碍；这里按网格包络外扩 1~2 cm。
      footprint: "[ [0.55, 0.38], [0.55, -0.38], [-0.54, -0.38], [-0.54, 0.38] ]"
      # 【重要改动】局部代价地图改用普通 ObstacleLayer（2D），不再用 VoxelLayer。
      # 原因：
      #   1) /scan 本身就是一平面 2D 扫描，没有任何立体信息，VoxelLayer 的
      #      z 窗口只会带来“点落在窗口外被静默丢掉”的风险（历史上 origin_z
      #      与 z_voxels 配错导致局部图长期全 0）；
      #   2) VoxelLayer 内部用 nav2_voxel_grid，把 z 索引塞进 uint32 的低/高
      #      16 位，z_voxels 最大 16，设大一点 resize() 直接失败、栅格尺寸为 0，
      #      局部图同样全 0；
      #   3) 全局代价地图用的就是 ObstacleLayer，实测标记/清除都正常
      #      （放一个 0.6 m 箱子：局部非 0 栅格 0 -> 642，删掉后 642 -> 0）。
      #      ObstacleLayer 只用 min/max_obstacle_height 做高度过滤，没有隐式
      #      z 窗口，也不会因为 FAST-LIO 的 z 漂移而突然失效。
      # 如果以后要接真正的 3D 点云做立体避障，再换回 VoxelLayer，并把
      # z_voxels 控制在 16 以内、origin_z/z_resolution 覆盖实际点云高度。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 【关键修正】FAST-LIO 的 odom 系原点在 IMU 起始位姿上（离地约 1.15 m），
        # base_link 在 odom 系 z ≈ -0.91 ~ -1.16（会漂），/scan 的点也在这一高度。
        # 默认 min_obstacle_height=0.0 会把它们全部当成“地面以下的非法命中点”
        # 丢掉，表现为“雷达探测不到障碍物、完全无法避障”。必须给负值；
        # max_obstacle_height=2.0 保证 1.4 m 高的箱子、墙都在范围内。
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        # 【关键】为什么加第二个观测源 cloud：
        # /scan 是 360 束点云投影出来的，30° 前倾后绝大部分回波打到地面又被
        # 高度过滤掉，只剩 120 多束有效回波；障碍物拖走后，没有被任何射线
        # 穿过的栅格就永远清不掉 —— 表现就是“障碍物移开了，代价地图上的
        # 障碍包络一直留着”。FAST-LIO 的 /cloud_registered 每帧上千点、覆盖
        # 整个前方，用它做稠密射线清除，实测 4 s 内就能把包络清干净。
        # 顺序：scan 先标（可靠），cloud 再补标 + 密集清除。
        observation_sources: scan cloud
        scan:
          # 【修正】相对名 `scan` 会被解析成 /<costmap>/scan（0 个发布者），
          # 障碍层收不到任何激光，局部避障完全失效；必须写绝对话题 /scan。
          topic: /scan
          # 源代码里的 min_obstacle_height 会覆盖层级的同名参数，
          # 这里显式给负值，否则点（odom z≈-0.9~-1.2）全部被滤掉。
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # raytrace_max_range 必须 ≥ obstacle_max_range：超过 raytrace 距离的
          # 回波会被整条跳过（不是截断），那条射线就不参与清除，被标记的栅格
          # 只能等别的射线来清。局部地图只有 4×4 m，取 10 m 足以清空整个窗口。
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        cloud:
          # 【修正】用 body 系点云 /cloud_registered_body（FAST-LIO 的 IMU 体系）。
          # 为什么不用 /cloud_registered（frame=odom）：nav2 标记和射线清除时把
          # "点云所在坐标系的原点"当作传感器原点，odom 原点是 FAST-LIO 的起始
          # 位姿；车一开出去就落在 4×4 m 滚动窗口外，整条观测被 continue 掉
          # （日志刷 "Sensor origin at (0.00, 0.00) is out of map bounds ...
          # cannot raytrace"），局部图彻底失明。body 系的传感器原点就是机器人
          # 自己，永远在窗口中心。
          #
          # 【配套修正】FAST-LIO 之前把这条点云的 frame_id 写成 base_link，
          # 但它实际是 IMU 体系（laserMapping.cpp publish_frame_body 里用
          # RGBpointBodyLidarToIMU 转的）。URDF 里 IMU 比 base_link 高 0.89 m，
          # nav2 会用 odom<-base_link（z≈-0.96）而不是 odom<-livox_imu（z≈-0.07）
          # 去变换，整帧点云被压低 0.89 m，真实障碍全部落到下面的高度带之外被
          # 滤掉 —— 这就是"拖进来的障碍物检测不到、直接撞上去"的直接原因。
          # 已把 laserMapping.cpp 里的 frame_id 改回 livox_imu，此处才成立。
          #
          # 【重要】高度过滤用的是**代价地图全局坐标系**（这里是 odom），不是
          # 点云自己的坐标系：nav2 的 ObservationBuffer 先把点云变换到
          # global_frame 再按 z 过滤。odom 系里地面 z≈-1.15（雷达离地 1.15 m），
          # 障碍物都在 -0.9 以上。下限 -0.85 滤掉地面并给 FAST-LIO 的高度漂移
          # 留 0.3 m 余量，上限 2.0 覆盖 1.4 m 高的箱子和墙面。
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -0.85
          max_obstacle_height: 2.0
          # 局部窗口只有 4×4 m，6 m 足够覆盖；再远只会白白扫栅格。
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      # 【新增】同 local_costmap：FAST-LIO 的 odom->base_link 比雷达时间戳晚
      # 0.3~0.6 s 才发出，默认 0.3 s 的 MessageFilter 缓存会把 /scan 全丢掉。
      # 全局图的 cloud 源（/cloud_registered，odom 系）不受影响，但 scan 源需要。
      transform_tolerance: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 【改动】与 local_costmap 保持同一矩形轮廓（机器人不是圆形，用 robot_radius 会
      # 在窄通道里过度保守或碰撞，取决于外接圆/内切圆取法）。
      footprint: "[ [0.55, 0.38], [0.55, -0.38], [-0.54, -0.38], [-0.54, 0.38] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 【关键修正】与 local_costmap 同一个问题：map 系原点也在 IMU 起始位姿，
        # /scan 的点在 map 系 z ≈ -0.91，默认 min_obstacle_height=0.0 会把它们
        # 全部当作“地面以下的非法命中点”丢掉，全局障碍层永远收不到障碍物。
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        # 与 local_costmap 同一套分工：scan 负责标记，cloud 负责稠密清除。
        observation_sources: scan cloud
        scan:
          # A relative topic will be appended to the parent of the global_costmap namespace.
          # For example:
          #   * User chosen namespace is `tb4`.
          #   * User chosen topic is `scan`.
          #   * Topic will be remapped to `/tb4/scan` without `global_costmap`.
          #   * Use global topic `/scan` if you do not wish the node namespace to apply
          # 【修正】相对名 `scan` 会被解析成 /<costmap>/scan（0 个发布者），障碍层
          # 收不到任何激光，局部避障完全失效；必须写绝对话题 /scan。
          topic: /scan
          # 【新增】同上：/scan 的点在 map 系 z ≈ -0.91，默认 0.0 会被全部滤掉。
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 【改动】2.5/3.0 -> 15.0/15.0：雷达前倾 30° 后，回波大多落在 4~15 m
          # （地面/墙），原来的 2.5 m 几乎什么都标不上，规划器看不到拖进来的
          # 障碍物。这里放到雷达量程上限 15 m，标记范围与清除范围一致：
          # 凡是能被标上的回波，都能被同一条射线清掉，不会留下幽灵障碍。
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
        cloud:
          # 【修正】改用 /cloud_registered_body（livox_imu 系）而不是
          # /cloud_registered（odom 系）。两者点数完全相同，但 nav2 把"点云
          # 坐标系的原点"当传感器原点做射线清除：odom 原点是 FAST-LIO 的起始
          # 位姿，离车越远，清除射线就越是从一个错误的位置发散出去，会把沿途
          # 的真实障碍（墙）一起清掉。livox_imu 的原点就是车上的雷达，射线
          # 方向才是对的。map 系 z 原点与 odom 系几乎重合（map<-odom 平移
          # ≈(0,0,0.02)），所以下面的高度带不用改。
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # 地面点（map 系 z ≈ -1.14）必须滤掉，否则整片地面被标成障碍。
          min_obstacle_height: -0.85
          max_obstacle_height: 2.0
          # 【关键】全局地图是 21×21 m，点云每帧都整幅扫描会让单次更新超过
          # update_frequency 周期，缓冲区越积越多（实测滞后 25 s 还在涨）。
          # 只清机器人周围 6 m —— 幽灵障碍只在机器人附近影响规划，
          # 远处的残留由 /scan 自己的射线清。
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

# The yaml_filename value is overridden at launch time by bringup_launch.py's "map"
# argument (via RewrittenYaml param_rewrites). It must still be present here — even empty —
# otherwise the rewrite has no key to replace and map_server fails to configure.
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/demo/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/demo/cmd_vel"
    enable_stamped_cmd_vel: true
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"      # 同理：绝对话题，避免解析成 /collision_monitor/scan
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    enable_stamped_cmd_vel: true