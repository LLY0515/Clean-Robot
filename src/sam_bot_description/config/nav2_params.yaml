# ============================================================================
#  【改动】AMCL 已移除。
#  全局定位改由 fastlio_localization/relocalization_node 完成：它把
#  FAST-LIO 的 /cloud_registered（odom 系点云）与先验 3D 地图
#  （map/prior_3d_map.pcd）做全局搜索 + ICP，直接发布 map->odom。
#  参数见 fastlio_localization/config/relocalization_params.yaml。
#
#  说明：nav2_params.yaml 里不再保留 amcl 段；map_server 段仍然保留，
#  navigation.launch.py 会单独启动 map_server 并覆盖 yaml_filename。
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /demo/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: /demo/odom
    use_realtime_priority: false
    enable_stamped_cmd_vel: true

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 【改动】3×3 -> 4×4：原来局部代价地图只有车周围 1.5 m，拖进来的障碍物
      # 进入 1.5 m 才开始避障，配合 MPPI 的预测时域往往来不及。4×4 给到 2 m。
      # 注意：局部代价地图再大也没用，超出这张图范围的障碍物仍然不会显示，
      # 远处障碍物由 global_costmap 的 obstacle_layer 负责（见下面 15 m）。
      width: 4
      height: 4
      resolution: 0.05
      # 【改动】新 CAD 模型外形约 1.05 m(长) x 0.74 m(宽，含驱动轮)，base_link 在车体中心。
      # 旧值 0.42 x 0.39 是按小机器人设置的，若继续沿用会让规划器认为可以贴墙太近，
      # 实际车身会撞到障碍；这里按网格包络外扩 1~2 cm。
      footprint: "[ [0.55, 0.38], [0.55, -0.38], [-0.54, -0.38], [-0.54, 0.38] ]"
      # 【重要改动】局部代价地图改用普通 ObstacleLayer（2D），不再用 VoxelLayer。
      # 原因：
      #   1) /scan 本身就是一平面 2D 扫描，没有任何立体信息，VoxelLayer 的
      #      z 窗口只会带来“点落在窗口外被静默丢掉”的风险（历史上 origin_z
      #      与 z_voxels 配错导致局部图长期全 0）；
      #   2) VoxelLayer 内部用 nav2_voxel_grid，把 z 索引塞进 uint32 的低/高
      #      16 位，z_voxels 最大 16，设大一点 resize() 直接失败、栅格尺寸为 0，
      #      局部图同样全 0；
      #   3) 全局代价地图用的就是 ObstacleLayer，实测标记/清除都正常
      #      （放一个 0.6 m 箱子：局部非 0 栅格 0 -> 642，删掉后 642 -> 0）。
      #      ObstacleLayer 只用 min/max_obstacle_height 做高度过滤，没有隐式
      #      z 窗口，也不会因为 FAST-LIO 的 z 漂移而突然失效。
      # 如果以后要接真正的 3D 点云做立体避障，再换回 VoxelLayer，并把
      # z_voxels 控制在 16 以内、origin_z/z_resolution 覆盖实际点云高度。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 【关键修正】FAST-LIO 的 odom 系原点在 IMU 起始位姿上（离地约 1.15 m），
        # base_link 在 odom 系 z ≈ -0.91 ~ -1.16（会漂），/scan 的点也在这一高度。
        # 默认 min_obstacle_height=0.0 会把它们全部当成“地面以下的非法命中点”
        # 丢掉，表现为“雷达探测不到障碍物、完全无法避障”。必须给负值；
        # max_obstacle_height=2.0 保证 1.4 m 高的箱子、墙都在范围内。
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        # 【关键】为什么加第二个观测源 cloud：
        # /scan 是 360 束点云投影出来的，30° 前倾后绝大部分回波打到地面又被
        # 高度过滤掉，只剩 120 多束有效回波；障碍物拖走后，没有被任何射线
        # 穿过的栅格就永远清不掉 —— 表现就是“障碍物移开了，代价地图上的
        # 障碍包络一直留着”。FAST-LIO 的 /cloud_registered 每帧上千点、覆盖
        # 整个前方，用它做稠密射线清除，实测 4 s 内就能把包络清干净。
        # 顺序：scan 先标（可靠），cloud 再补标 + 密集清除。
        observation_sources: scan cloud
        scan:
          # 【修正】相对名 `scan` 会被解析成 /<costmap>/scan（0 个发布者），
          # 障碍层收不到任何激光，局部避障完全失效；必须写绝对话题 /scan。
          topic: /scan
          # 源代码里的 min_obstacle_height 会覆盖层级的同名参数，
          # 这里显式给负值，否则点（odom z≈-0.9~-1.2）全部被滤掉。
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # raytrace_max_range 必须 ≥ obstacle_max_range：超过 raytrace 距离的
          # 回波会被整条跳过（不是截断），那条射线就不参与清除，被标记的栅格
          # 只能等别的射线来清。局部地图只有 4×4 m，取 10 m 足以清空整个窗口。
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        cloud:
          topic: /cloud_registered
          data_type: "PointCloud2"
          # 标记和清除都打开：点云比 /scan 密，一起标记能补上 2D 投影漏掉的
          # 障碍物；同时它自己的标记和清除互相自洽，不会出现“刚标上就被
          # 同一次更新清掉”的情况。
          marking: True
          clearing: True
          # 地面点在 odom 系 z ≈ -1.14，base_link 在 -0.97，障碍物都在
          # -0.9 以上。下限取 -0.85 把地面滤掉（否则整片地面会被标成障碍），
          # 留 0.3 m 余量吸收 FAST-LIO 的高度漂移。
          min_obstacle_height: -0.85
          max_obstacle_height: 2.0
          # 局部窗口只有 4×4 m，6 m 足够覆盖；再远只会白白扫栅格。
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 【改动】与 local_costmap 保持同一矩形轮廓（机器人不是圆形，用 robot_radius 会
      # 在窄通道里过度保守或碰撞，取决于外接圆/内切圆取法）。
      footprint: "[ [0.55, 0.38], [0.55, -0.38], [-0.54, -0.38], [-0.54, 0.38] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 【关键修正】与 local_costmap 同一个问题：map 系原点也在 IMU 起始位姿，
        # /scan 的点在 map 系 z ≈ -0.91，默认 min_obstacle_height=0.0 会把它们
        # 全部当作“地面以下的非法命中点”丢掉，全局障碍层永远收不到障碍物。
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        # 与 local_costmap 同一套分工：scan 负责标记，cloud 负责稠密清除。
        observation_sources: scan cloud
        scan:
          # A relative topic will be appended to the parent of the global_costmap namespace.
          # For example:
          #   * User chosen namespace is `tb4`.
          #   * User chosen topic is `scan`.
          #   * Topic will be remapped to `/tb4/scan` without `global_costmap`.
          #   * Use global topic `/scan` if you do not wish the node namespace to apply
          # 【修正】相对名 `scan` 会被解析成 /<costmap>/scan（0 个发布者），障碍层
          # 收不到任何激光，局部避障完全失效；必须写绝对话题 /scan。
          topic: /scan
          # 【新增】同上：/scan 的点在 map 系 z ≈ -0.91，默认 0.0 会被全部滤掉。
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 【改动】2.5/3.0 -> 15.0/15.0：雷达前倾 30° 后，回波大多落在 4~15 m
          # （地面/墙），原来的 2.5 m 几乎什么都标不上，规划器看不到拖进来的
          # 障碍物。这里放到雷达量程上限 15 m，标记范围与清除范围一致：
          # 凡是能被标上的回波，都能被同一条射线清掉，不会留下幽灵障碍。
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
        cloud:
          # FAST-LIO 配准后的稠密世界点云（odom 系，10 Hz，约 1 千点/帧）。
          # 只做清除：把障碍物拖走后残留的障碍栅格连同膨胀包络一起扫掉。
          topic: /cloud_registered
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # 地面点（map 系 z ≈ -1.14）必须滤掉，否则整片地面被标成障碍。
          min_obstacle_height: -0.85
          max_obstacle_height: 2.0
          # 【关键】全局地图是 21×21 m，点云每帧都整幅扫描会让单次更新超过
          # update_frequency 周期，缓冲区越积越多（实测滞后 25 s 还在涨）。
          # 只清机器人周围 6 m —— 幽灵障碍只在机器人附近影响规划，
          # 远处的残留由 /scan 自己的射线清。
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

# The yaml_filename value is overridden at launch time by bringup_launch.py's "map"
# argument (via RewrittenYaml param_rewrites). It must still be present here — even empty —
# otherwise the rewrite has no key to replace and map_server fails to configure.
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/demo/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/demo/cmd_vel"
    enable_stamped_cmd_vel: true
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"      # 同理：绝对话题，避免解析成 /collision_monitor/scan
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    enable_stamped_cmd_vel: true